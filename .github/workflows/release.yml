name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # node-pty 原生模块由 node-gyp@9 构建，其 gyp 依赖 Python 标准库 distutils
      # （Python 3.12 已移除），故固定 Python 3.11 供 node-gyp 使用
      - name: Set up Python 3.11 (for node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust sidecar (release)
        run: cargo build --release --manifest-path stardust-engine/Cargo.toml

      - run: npm ci

      - name: Build frontend (${{ matrix.platform }})
        run: npx vite build

      - name: Package (${{ matrix.platform }})
        timeout-minutes: 30
        env:
          # node-gyp 显式使用 3.11（runner 默认 python 3.12+ 已无 distutils）
          npm_config_python: python3.11
          PYTHON: python3.11
          # electron-builder 上传产物 + latest*.yml 更新元数据到 GitHub Releases
          # （需要 GH_TOKEN，GITHUB_TOKEN 由 Actions 自动注入，permissions 已含 contents: write）
          GH_TOKEN: ${{ github.token }}
        # tag 触发时发布到 GitHub Releases（自动更新数据源）；手动触发时只打包不上传
        run: npx electron-builder --${{ matrix.platform }} --publish=${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Stardust-${{ matrix.platform }}
          path: release/*

  # 注意：产物已由 electron-builder 在上一步（--publish=always）上传到 Draft Release。
  # 本 job 仅校验 Draft Release 是否完整，供人工发布前确认。
  verify-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Draft Release assets
        run: |
          echo "=== 检查 v${{ github.ref_name }} Draft Release ==="
          gh release view "${{ github.ref_name }}" --json name,isDraft,assets --jq '{ name: .name, isDraft: .isDraft, assetCount: (.assets | length) }'
          echo "=== 确认更新元数据文件存在 ==="
          gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' | grep -E "latest(-mac|-linux)?\.yml" || echo "⚠️ 未找到 latest*.yml（自动更新将不可用）"
        env:
          GH_TOKEN: ${{ github.token }}
